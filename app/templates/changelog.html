{% extends "base.html" %}
{% block title %}Changelog · deleg8{% endblock %}
{% block content %}
<section class="wrap page">
  <h1>Changelog</h1>
  <p class="lede">{{ lede }}</p>
  <div class="changelog">
    {% for e in changelog %}
    <article class="card">
      <time datetime="{{ e.date }}">{{ e.display_date }}</time>
      <h2>{{ e.title }}</h2>
      <p>{{ e.summary }}</p>
    </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
